[platformio]
src_dir = firmware/nrf52840
default_envs = supermini_ble

[env:supermini_ble]
platform = nordicnrf52@10.12.0
platform_packages = framework-arduinoadafruitnrf52@1.10700.0
board = supermini_bridge
framework = arduino
board_build.variants_dir = variants
board_build.ldscript = firmware/nrf52840/nrf52840_s140_v7.ld
build_unflags = -std=gnu++11
build_flags = -I include -std=gnu++17
monitor_speed = 115200
